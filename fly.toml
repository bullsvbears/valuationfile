# Fly.io deployment for a single-analyst dashboard.
#
#   fly apps create <your-app-name>          # app names are globally unique
#   # set `app` and `primary_region` below to match
#   fly volumes create valuation_data --size 1 --yes
#   fly secrets import < secrets.env         # from `npm run hash-password -- --out`
#   fly deploy --ha=false
#
# --ha=false matters: Fly otherwise starts two machines for an HTTP service,
# and the second would have no volume to mount. One machine is also what this
# app wants, since the JSON tiers have a single writer.

app = "valuationfile"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "8080"

# Overrides and own models are written here, so this volume is the live data,
# not a cache. A redeploy replaces the image and leaves the volume alone.
[[mounts]]
  source = "valuation_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One analyst, one session: keeping a single machine means the volume has a
  # single writer and there is no state to share between instances.
  #
  # "stop" rather than "suspend": suspend resumes faster but carries more
  # configuration caveats, and a cold boot here is a couple of seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
